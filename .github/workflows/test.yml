name: Conformance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare-reference:
    name: Generate independent Apple reference fixtures
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - name: Download pinned reference compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/coreml-reference"
          cd "$RUNNER_TEMP/coreml-reference"
          curl --fail --location --retry 3 --output reference.tar.gz https://github.com/xiaozhuai/coremlcompiler-standalone/releases/download/v3500.32.1/coremlcompiler-standalone.tar.gz
          echo '1674a561e9fd808dd9c362efdbb225a91b30f40529796793a6b154894af474ae  reference.tar.gz' | shasum -a 256 --check -
          tar -xzf reference.tar.gz
      - name: Construct fresh synthetic weights, keys, and expected outputs
        shell: bash
        run: |
          node tools/prepare-conformance.mjs --reference "$RUNNER_TEMP/coreml-reference/libexec/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/coremlcompiler" --output "$RUNNER_TEMP/conformance"
      - uses: actions/upload-artifact@v7
        with:
          name: independent-conformance
          path: ${{ runner.temp }}/conformance/corpus.json
          if-no-files-found: error
          retention-days: 7
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    needs: prepare-reference
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/download-artifact@v8
        with:
          name: independent-conformance
          path: ${{ runner.temp }}/conformance
      - run: npm ci
      - run: npm test
        env:
          XCOREML_CONFORMANCE_FILE: ${{ runner.temp }}/conformance/corpus.json
